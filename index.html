<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #70c5ce;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      background: #70c5ce;
      display: block;
      border: 2px solid #222;
      border-radius: 10px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let birdY = canvas.height / 2;
    let birdRadius = 20;
    let velocity = 0;
    let gravity = 0.5;
    let isGameOver = false;
    let score = 0;
    let highScore = 0;

    // Pipe settings
    let pipes = [];
    const pipeGap = 160; // Easier gap
    const pipeWidth = 60;
    const pipeSpeed = 2;

    // Generate pipes
    setInterval(() => {
      if (!isGameOver) {
        const topHeight = Math.random() * (canvas.height - pipeGap - 100) + 50;
        pipes.push({ x: canvas.width, top: topHeight, passed: false });
      }
    }, 1500);

    function resetGame() {
      birdY = canvas.height / 2;
      velocity = 0;
      pipes = [];
      score = 0;
      isGameOver = false;
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bird
      ctx.fillStyle = "gold";
      ctx.beginPath();
      ctx.arc(100, birdY, birdRadius, 0, Math.PI * 2);
      ctx.fill();

      // Gravity
      velocity += gravity;
      birdY += velocity;

      // Pipes
      ctx.fillStyle = "green";
      for (let i = 0; i < pipes.length; i++) {
        const pipe = pipes[i];
        pipe.x -= pipeSpeed;

        // Top pipe
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        // Bottom pipe
        ctx.fillRect(pipe.x, pipe.top + pipeGap, pipeWidth, canvas.height - pipe.top - pipeGap);

        // Collision
        if (
          100 + birdRadius > pipe.x &&
          100 - birdRadius < pipe.x + pipeWidth &&
          (birdY - birdRadius < pipe.top || birdY + birdRadius > pipe.top + pipeGap)
        ) {
          isGameOver = true;
        }

        // Scoring
        if (!pipe.passed && pipe.x + pipeWidth < 100) {
          pipe.passed = true;
          score++;
          if (score > highScore) highScore = score;
        }
      }

      // Border collision
      if (birdY + birdRadius > canvas.height || birdY - birdRadius < 0) {
        isGameOver = true;
      }

      // Score
      ctx.fillStyle = "#fff";
      ctx.font = "24px Arial";
      ctx.fillText("Score: " + score, 20, 40);
      ctx.fillText("High Score: " + highScore, 20, 70);

      // Game Over
      if (isGameOver) {
        ctx.fillStyle = "red";
        ctx.font = "40px Arial";
        ctx.fillText("Game Over", canvas.width / 2 - 110, canvas.height / 2);
        ctx.font = "20px Arial";
        ctx.fillText("Tap, Click or Press Enter", canvas.width / 2 - 110, canvas.height / 2 + 40);
        return;
      }

      requestAnimationFrame(draw);
    }

    // Start game
    draw();

    // Keyboard controls
    document.addEventListener('keydown', e => {
      if (e.code === "Space" && !isGameOver) velocity = -8;
      if (e.code === "Enter" && isGameOver) resetGame();
    });

    // Touch controls
    canvas.addEventListener('touchstart', () => {
      if (isGameOver) {
        resetGame();
      } else {
        velocity = -8;
      }
    });

    // Mouse click
    canvas.addEventListener('mousedown', () => {
      if (isGameOver) {
        resetGame();
      } else {
        velocity = -8;
      }
    });
  </script>
</body>
</html>
