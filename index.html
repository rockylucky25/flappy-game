<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Bird Mini</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #70c5ce;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #70c5ce;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <!-- Sounds -->
  <audio id="flapSound" src="flap.mp3" preload="auto"></audio>
<audio id="scoreSound" src="score.mp3" preload="auto"></audio>
<audio id="gameOverSound" src="gameover.mp3" preload="auto"></audio>


  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const flapSound = document.getElementById("flapSound");
    const scoreSound = document.getElementById("scoreSound");
    const gameOverSound = document.getElementById("gameOverSound");

    let birdY = canvas.height / 2;
    let birdRadius = 20;
    let velocity = 0;
    let gravity = 0.5;
    let isGameOver = false;
    let score = 0;
    let highScore = localStorage.getItem("highScore") || 0;

    let pipes = [];
    const pipeGap = 180;
    const pipeWidth = 60;
    const pipeSpeed = 2;

    setInterval(() => {
      if (!isGameOver) {
        const topHeight = Math.random() * (canvas.height - pipeGap - 100) + 50;
        pipes.push({ x: canvas.width, top: topHeight, passed: false });
      }
    }, 1600);

    function resetGame() {
      birdY = canvas.height / 2;
      velocity = 0;
      pipes = [];
      score = 0;
      isGameOver = false;
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bird
      ctx.fillStyle = "gold";
      ctx.beginPath();
      ctx.arc(100, birdY, birdRadius, 0, Math.PI * 2);
      ctx.fill();

      // Apply gravity
      velocity += gravity;
      birdY += velocity;

      // Draw and update pipes
      ctx.fillStyle = "green";
      pipes.forEach(pipe => {
        pipe.x -= pipeSpeed;

        // Top pipe
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        // Bottom pipe
        ctx.fillRect(pipe.x, pipe.top + pipeGap, pipeWidth, canvas.height - pipe.top - pipeGap);

        // Collision detection
        if (
          100 + birdRadius > pipe.x &&
          100 - birdRadius < pipe.x + pipeWidth &&
          (birdY - birdRadius < pipe.top || birdY + birdRadius > pipe.top + pipeGap)
        ) {
          if (!isGameOver) gameOverSound.play();
          isGameOver = true;
        }

        // Score tracking
        if (!pipe.passed && pipe.x + pipeWidth < 100) {
          pipe.passed = true;
          score++;
          scoreSound.play();
          if (score > highScore) {
            highScore = score;
            localStorage.setItem("highScore", highScore);
          }
        }
      });

      // Ground/ceiling check
      if (birdY + birdRadius > canvas.height || birdY - birdRadius < 0) {
        if (!isGameOver) gameOverSound.play();
        isGameOver = true;
      }

      // Draw score
      ctx.fillStyle = "#fff";
      ctx.font = "24px Arial";
      ctx.fillText("Score: " + score, 20, 40);
      ctx.fillText("High: " + highScore, 20, 70);

      if (isGameOver) {
        ctx.fillStyle = "red";
        ctx.font = "36px Arial";
        ctx.fillText("Game Over", canvas.width / 2 - 100, canvas.height / 2);
        ctx.font = "18px Arial";
        ctx.fillText("Tap or Press Enter to Restart", canvas.width / 2 - 110, canvas.height / 2 + 40);
        return;
      }

      requestAnimationFrame(draw);
    }

    // Start
    draw();

    // Desktop Controls
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !isGameOver) {
        velocity = -8;
        flapSound.play();
      }
      if (e.code === "Enter" && isGameOver) resetGame();
    });

    // Mobile tap
    canvas.addEventListener("touchstart", () => {
      if (isGameOver) {
        resetGame();
      } else {
        velocity = -8;
        flapSound.play();
      }
    });
  </script>
</body>
</html>
