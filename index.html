<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #222;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
      margin: auto;
      background: #70c5ce;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="480" height="640"></canvas>
  
  <!-- Audio -->
  <audio id="jumpSound" src="jump.mp3" preload="auto"></audio>
  <audio id="scoreSound" src="score.mp3" preload="auto"></audio>
  <audio id="gameOverSound" src="gameover.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let birdY = canvas.height / 2;
    const birdRadius = 20;
    let velocity = 0;
    const gravity = 0.5;
    let isGameOver = false;
    let score = 0;
    let highScore = localStorage.getItem("highScore") || 0;
    let isStarted = false;

    const pipes = [];
    const pipeGap = 150;
    const pipeWidth = 60;
    const pipeSpeed = 2;

    const jumpSound = document.getElementById("jumpSound");
    const scoreSound = document.getElementById("scoreSound");
    const gameOverSound = document.getElementById("gameOverSound");

    function resetGame() {
      birdY = canvas.height / 2;
      velocity = 0;
      pipes.length = 0;
      score = 0;
      isGameOver = false;
      isStarted = false;
      draw();
    }

    setInterval(() => {
      if (!isGameOver && isStarted) {
        const topHeight = Math.random() * (canvas.height - pipeGap - 100) + 50;
        pipes.push({ x: canvas.width, top: topHeight, passed: false });
      }
    }, 1500);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw bird
      ctx.fillStyle = "gold";
      ctx.beginPath();
      ctx.arc(100, birdY, birdRadius, 0, Math.PI * 2);
      ctx.fill();

      if (isStarted && !isGameOver) {
        velocity += gravity;
        birdY += velocity;
      }

      // Pipes
      ctx.fillStyle = "green";
      for (let pipe of pipes) {
        pipe.x -= pipeSpeed;

        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, pipe.top + pipeGap, pipeWidth, canvas.height - pipe.top - pipeGap);

        if (
          100 + birdRadius > pipe.x &&
          100 - birdRadius < pipe.x + pipeWidth &&
          (birdY - birdRadius < pipe.top || birdY + birdRadius > pipe.top + pipeGap)
        ) {
          if (!isGameOver) {
            isGameOver = true;
            gameOverSound.play();
            if (score > highScore) {
              highScore = score;
              localStorage.setItem("highScore", highScore);
            }
          }
        }

        if (!pipe.passed && pipe.x + pipeWidth < 100) {
          pipe.passed = true;
          score++;
          scoreSound.play();
        }
      }

      // Ground / Ceiling Collision
      if (birdY + birdRadius > canvas.height || birdY - birdRadius < 0) {
        if (!isGameOver) {
          isGameOver = true;
          gameOverSound.play();
          if (score > highScore) {
            highScore = score;
            localStorage.setItem("highScore", highScore);
          }
        }
      }

      // Score
      ctx.fillStyle = "#fff";
      ctx.font = "28px Arial";
      ctx.fillText("Score: " + score, 20, 40);
      ctx.fillText("High: " + highScore, 20, 70);

      if (!isStarted) {
        ctx.fillStyle = "#fff";
        ctx.font = "30px Arial";
        ctx.fillText("Tap or Press Space", canvas.width / 2 - 130, canvas.height / 2);
        ctx.font = "18px Arial";
        ctx.fillText("to Start", canvas.width / 2 - 35, canvas.height / 2 + 30);
      }

      if (isGameOver) {
        ctx.fillStyle = "red";
        ctx.font = "40px Arial";
        ctx.fillText("Game Over", canvas.width / 2 - 110, canvas.height / 2 + 70);
        ctx.font = "20px Arial";
        ctx.fillText("Tap or Press Enter to Restart", canvas.width / 2 - 120, canvas.height / 2 + 100);
        return;
      }

      requestAnimationFrame(draw);
    }

    draw();

    // Controls
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (!isStarted) {
          isStarted = true;
          velocity = -8;
          jumpSound.play();
        } else if (!isGameOver) {
          velocity = -8;
          jumpSound.play();
        }
      }
      if (e.code === "Enter" && isGameOver) {
        resetGame();
      }
    });

    canvas.addEventListener("touchstart", () => {
      if (!isStarted) {
        isStarted = true;
        velocity = -8;
        jumpSound.play();
      } else if (isGameOver) {
        resetGame();
      } else {
        velocity = -8;
        jumpSound.play();
      }
    });
  </script>
</body>
</html>
