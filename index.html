<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #70c5ce; font-family: Arial, sans-serif; }
    canvas { display: block; margin: auto; background: #70c5ce; }
    #pauseBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 10px 15px;
      font-size: 16px;
      background: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1;
    }
  </style>
</head>
<body>

<button id="pauseBtn">Pause</button>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const pauseBtn = document.getElementById("pauseBtn");

let birdY = canvas.height / 2;
let birdRadius = 20;
let velocity = 0;
let gravity = 0.5;
let isGameOver = false;
let isPaused = false;
let hasStarted = false;
let score = 0;
let highScore = 0;

// Pipes
let pipes = [];
const pipeGap = 150;
const pipeWidth = 60;
const pipeSpeed = 2;

// Pipe generator
setInterval(() => {
  if (!isGameOver && hasStarted && !isPaused) {
    const topHeight = Math.random() * (canvas.height - pipeGap - 150) + 50;
    pipes.push({ x: canvas.width, top: topHeight, passed: false });
  }
}, 1500);

// Reset
function resetGame() {
  birdY = canvas.height / 2;
  velocity = 0;
  pipes = [];
  score = 0;
  isGameOver = false;
  hasStarted = false;
  draw();
}

// Draw loop
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = "#70c5ce";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Bird
  ctx.fillStyle = "gold";
  ctx.beginPath();
  ctx.arc(100, birdY, birdRadius, 0, Math.PI * 2);
  ctx.fill();

  // Physics
  if (hasStarted && !isPaused && !isGameOver) {
    velocity += gravity;
    birdY += velocity;
  }

  // Pipes
  ctx.fillStyle = "green";
  pipes.forEach(pipe => {
    if (!isPaused && hasStarted && !isGameOver) pipe.x -= pipeSpeed;

    // Top pipe
    ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
    // Bottom pipe
    ctx.fillRect(pipe.x, pipe.top + pipeGap, pipeWidth, canvas.height - pipe.top - pipeGap);

    // Collision
    if (
      100 + birdRadius > pipe.x &&
      100 - birdRadius < pipe.x + pipeWidth &&
      (birdY - birdRadius < pipe.top || birdY + birdRadius > pipe.top + pipeGap)
    ) {
      isGameOver = true;
    }

    // Score
    if (!pipe.passed && pipe.x + pipeWidth < 100) {
      pipe.passed = true;
      score++;
      if (score > highScore) highScore = score;
    }
  });

  // Remove off-screen pipes
  pipes = pipes.filter(p => p.x + pipeWidth > 0);

  // Ceiling / Ground
  if (birdY + birdRadius > canvas.height || birdY - birdRadius < 0) {
    isGameOver = true;
  }

  // Scores
  ctx.fillStyle = "#fff";
  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 20, 40);
  ctx.fillText("High: " + highScore, 20, 70);

  // Game states
  if (!hasStarted) {
    ctx.fillStyle = "white";
    ctx.font = "32px Arial";
    ctx.fillText("Tap or Space to Start", canvas.width / 2 - 140, canvas.height / 2);
  }

  if (isPaused && hasStarted && !isGameOver) {
    ctx.fillStyle = "orange";
    ctx.font = "32px Arial";
    ctx.fillText("Paused", canvas.width / 2 - 50, canvas.height / 2);
  }

  if (isGameOver) {
    ctx.fillStyle = "red";
    ctx.font = "36px Arial";
    ctx.fillText("Game Over", canvas.width / 2 - 100, canvas.height / 2 - 30);
    ctx.font = "20px Arial";
    ctx.fillText("Tap or Enter to Restart", canvas.width / 2 - 110, canvas.height / 2 + 10);
  }

  requestAnimationFrame(draw);
}

// Input controls
function flap() {
  if (isGameOver) {
    resetGame();
  } else {
    hasStarted = true;
    if (!isPaused) velocity = -8;
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") flap();
  if (e.code === "Enter" && isGameOver) resetGame();
  if (e.code === "KeyP") isPaused = !isPaused;
});

canvas.addEventListener("touchstart", flap);
canvas.addEventListener("mousedown", flap);
pauseBtn.addEventListener("click", () => {
  if (hasStarted && !isGameOver) isPaused = !isPaused;
});

draw();
</script>

</body>
</html>
